<!-- @dsCard group="Telemetry" height=200 subtitle="bpm sets the pace" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Waveform</title>
<style>
  .col { display: flex; flex-direction: column; gap: var(--space-3); width: 100%; }
  .row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: var(--space-4); }
  .k { font: 600 10.5px/14px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body>
<div id="root" class="nc-ambient nc-preview"></div>
<script>
  var N = window.Nocturne, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'col' },
      h('div', { className: 'row' }, h('span', { className: 'k' }, 'emerald · 72'), h(N.Waveform, { bpm: 72, height: 44 })),
      h('div', { className: 'row' }, h('span', { className: 'k' }, 'cyan · 96'), h(N.Waveform, { bpm: 96, tone: 'cyan', height: 44 })),
      h('div', { className: 'row' }, h('span', { className: 'k' }, 'amber · 118'), h(N.Waveform, { bpm: 118, tone: 'amber', height: 44 }))));
</script>
</body>
</html>
