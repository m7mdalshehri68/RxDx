<!-- @dsCard group="Telemetry" height=300 subtitle="with a Waveform, a trend, or a footnote" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VitalTile</title>
<style>
  .grid { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: var(--space-4); width: 100%; align-items: start; }
</style>
</head>
<body>
<div id="root" class="nc-ambient nc-preview"></div>
<script>
  var N = window.Nocturne, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' },
      h(N.VitalTile, { label: 'Heart rate', value: 72, unit: 'bpm', icon: 'heart-pulse', accent: 'emerald', status: 'live' },
        h(N.Waveform, { bpm: 72, height: 56 })),
      h(N.VitalTile, { label: 'Blood pressure', value: '118/76', unit: 'mmHg', icon: 'activity', status: 'stable', statusLabel: 'In range',
        trend: [124, 121, 122, 119, 120, 117, 119, 118] }),
      h(N.VitalTile, { label: 'Temperature', value: '37.9', unit: '°C', icon: 'thermometer', accent: 'amber', status: 'watch', statusLabel: 'Rising',
        trend: [36.8, 36.9, 37.0, 37.1, 37.3, 37.6, 37.9], footnote: h('span', null, h('b', null, '+0.3 °C'), ' in the last hour') })));
</script>
</body>
</html>
