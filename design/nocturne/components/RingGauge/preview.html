<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RingGauge</title>
<style>
  .row { display: flex; align-items: center; gap: var(--space-8); }
</style>
</head>
<body>
<div id="root" class="nc-ambient nc-preview"></div>
<script>
  var N = window.Nocturne, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' },
      h(N.RingGauge, { value: 98, unit: '%', label: 'SpO₂', tone: 'cyan' }),
      h(N.RingGauge, { value: 7.4, max: 10, unit: 'h', label: 'Sleep', tone: 'emerald' }),
      h(N.RingGauge, { value: 64, unit: '%', label: 'Hydration', tone: 'amber', size: 120 })));
</script>
</body>
</html>
