<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RxDx — Design system</title>
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="app.css">
<script>
  (function () { var q = new URLSearchParams(location.search), r = document.documentElement;
    r.dataset.theme = q.get('theme') || 'light'; r.dir = q.get('dir') || 'ltr'; r.lang = r.dir === 'rtl' ? 'ar' : 'en'; if (q.get('embed')) r.dataset.embed = '1'; })();
</script>
<style>
  body{padding:0 0 80px}
  .sys-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px var(--pad);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  [data-embed] .sys-top{display:none}
  .sys-top .sp{flex:1}
  .sys{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
  .sys h2{margin:56px 0 6px;font:700 var(--fs-20)/1.3 var(--sans);letter-spacing:-.015em}
  .sys h2+p{margin:0 0 18px;color:var(--text-2);font-size:var(--fs-13)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .spec{padding:22px;border-radius:var(--r-card);border:1px dashed var(--border-strong);background:var(--surface-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .sw{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--paper)}
  .sw i{display:block;height:64px}
  .sw b{display:block;padding:10px 12px 2px;font:600 12.5px/1.2 var(--sans)}
  .sw code{display:block;padding:0 12px 10px;font:500 11px/1.4 var(--mono);color:var(--text-2)}
  .ts{display:flex;align-items:baseline;gap:18px;padding:10px 0;border-top:1px solid var(--border)}
  .ts:first-child{border-top:0}
  .ts code{width:70px;font:500 11px/1 var(--mono);color:var(--text-2);flex:none}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
  .quad iframe{width:100%;height:78vh;border:1px solid var(--border);border-radius:14px;background:var(--bg)}
  .quad figcaption{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--text-2);margin:0 0 8px}
</style>
</head>
<body>
<div class="sys-top"><a class="brand" href="app.html"><span class="brand-tile">Rx</span><span class="brand-word"><b>RxDx</b><small>Design system</small></span></a><span class="sp"></span>
  <div class="seg" id="mode"><button data-m="single" aria-pressed="true">Single</button><button data-m="quad" aria-pressed="false">Light · Dark · LTR · RTL</button></div>
  <button class="tbtn" id="dir">RTL</button><button class="tbtn" id="thm">Dark</button></div>
<div id="out"></div>
<script src="data.js"></script>
<script src="system.js"></script>
</body>
</html>
