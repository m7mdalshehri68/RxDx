# Deploy the RxDx Coding API on Render.
#
# In the Render dashboard: New → Blueprint → connect m7mdalshehri68/RxDx.
# Render reads this file, builds the image from api/Dockerfile with the
# repository root as the build context, and gives back a public URL.
#
# The free plan sleeps after fifteen idle minutes; the first request afterwards
# can wait about a minute for the container to wake. That is fine for a
# demonstration and not fine for a ward, which is what the hospital deployment is for.
#
# This public instance is for INVENTED TEXT ONLY. Real patients are coded by the
# same image inside the hospital network: see api/DEPLOY-ON-PREMISE.md.
services:
  - type: web
    name: rxdx-coding-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      # The copies of RxDx allowed to call this service from a browser: GitHub
      # Pages, Cloudflare Pages, and a copy opened from disk (its origin is
      # "null"). Hospital systems call it server to server and need no entry.
      - key: RXDX_ALLOW_ORIGINS
        value: "https://m7mdalshehri68.github.io,https://rxdx-5pn.pages.dev,null"
      # Marks this instance as the public demonstration, which makes the
      # documentation page warn against pasting real patient text.
      - key: RXDX_PUBLIC_DEMO
        value: "1"
      - key: RXDX_RATE_LIMIT
        value: "120"
      # Set a value here to require an X-API-Key header. Leave unset for an
      # open demonstration instance.
      - key: RXDX_API_KEY
        sync: false
